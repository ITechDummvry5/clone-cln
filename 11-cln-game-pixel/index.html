<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Pokémon Dash</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#10161a;font-family:"Press Start 2P","Courier New",monospace;color:#fff4d6}
body{display:grid;place-items:center}
canvas#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;align-items:center;padding:10px 14px;font-size:clamp(8px,1.6vw,13px);text-shadow:2px 2px 0 #1a241c;pointer-events:none}
#hud>div{background:rgba(26,36,28,.72);border:2px solid #c4a574;padding:7px 10px;display:flex;gap:10px;align-items:center}
#hud button{pointer-events:auto;font:inherit;color:#fff4d6;background:#b3342b;border:2px solid #fff4d6;padding:5px 8px;cursor:pointer}
#hud canvas{image-rendering:pixelated}
#sc{color:#ffd84a}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;background:radial-gradient(ellipse at top,rgba(30,60,90,.92),rgba(10,16,26,.96));text-align:center;overflow:auto}
.ov.show{display:flex}
h1{font-size:clamp(18px,4.5vw,40px);color:#ffd84a;text-shadow:3px 3px 0 #b3342b,6px 6px 0 #1a241c}
h2{font-size:clamp(14px,3vw,26px);text-shadow:3px 3px 0 #1a241c}
p.s{font-size:clamp(7px,1.3vw,10px);line-height:1.8;opacity:.9}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{width:min(190px,28vw);min-width:170px;background:#243044;border:4px solid #5a6a86;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card.sel{border-color:#ffd84a;box-shadow:0 0 0 3px #b3342b,0 0 24px rgba(255,216,74,.55);background:#2f4066}
.card canvas{width:100%;height:auto;border:3px solid #10161a;image-rendering:pixelated}
.card b{font-size:12px}.card i{font-style:normal;font-size:7px;color:#ffd84a;line-height:1.6}.card span{font-size:7px;line-height:1.7;opacity:.9;min-height:72px}
.btn{font:inherit;font-size:clamp(9px,1.6vw,12px);color:#fff4d6;background:#3a8a3a;border:3px solid #fff4d6;padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 #1a241c}
.btn:active{transform:translateY(3px);box-shadow:none}.btn.red{background:#b3342b}.btn.blue{background:#3a6ab0}
.card .btn{font-size:8px;padding:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:14px 18px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
#touch button{pointer-events:auto;touch-action:none;width:clamp(70px,18vw,110px);height:clamp(70px,18vw,110px);border-radius:50%;font:inherit;font-size:8px;color:#fff;background:rgba(26,36,28,.6);border:3px solid rgba(255,244,214,.8)}
#touch .g{display:flex;gap:12px}
</style></head><body>
