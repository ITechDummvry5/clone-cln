overning law</h2><p>These terms are governed by the laws of the country in which Kap Manga is operated, without regard to conflict-of-law rules.</p><h2>9. Contact</h2><p>Questions about these terms? Reach us through the <a href="contact.html">Contact</a> page${mail()?' or at '+cm():''}.</p>`},
privacy:{t:'Privacy Policy',u:UPD,b:()=>`<p>Your privacy matters to us. This policy explains what information Kap Manga handles and the choices you have.</p><h2>1. The short version</h2><p>You do not need an account to use Kap Manga. We do not sell your personal information, and we do not use advertising or tracking cookies.</p><h2>2. Information we handle</h2><ul><li><strong>Messages you send us.</strong> If you contact us or report an issue, we receive the details you choose to include, such as your name and email address.</li><li><strong>Data stored on your device.</strong> The site saves its library data and settings in your browser storage on your own device. See our <a href="cookies.html">Cookie Settings</a> page for details.</li><li><strong>Technical data.</strong> Our hosting provider may keep standard server logs, such as IP address, browser type and the pages requested, for security and reliability.</li></ul><h2>3. How we use information</h2><ul><li>To reply to your messages and fix problems you report.</li><li>To keep the site secure and working properly.</li></ul><h2>4. Third-party services</h2><p>The site loads the Inter typeface from Google Fonts. When your browser requests the font files, Google receives technical information such as your IP address. Material linked from the site may also be hosted by third parties with their own privacy practices.</p><h2>5. Retention</h2><p>We keep messages only as long as needed to respond and follow up. Data saved in your browser stays on your device until you clear it.</p><h2>6. Children</h2><p>Kap Manga is not directed at children under 13, and we do not knowingly collect personal information from them.</p><h2>7. Your rights</h2><p>Depending on where you live, you may have the right to ask what information we hold about you, to correct it or to have it deleted. Contact us and we will help.</p><h2>8. Changes to this policy</h2><p>We may update this policy from time to time. The date at the top shows the latest version.</p><h2>9. Contact</h2><p>For privacy questions, use the <a href="contact.html">Contact</a> page${mail()?' or write to '+cm():''}.</p>`},
dmca:{t:'DMCA',u:UPD,b:()=>`<p>Kap Manga respects the intellectual property rights of others and responds to notices of alleged copyright infringement that comply with the Digital Millennium Copyright Act (DMCA) and similar laws.</p><h2>Filing a notice</h2><p>If you are a copyright owner, or authorized to act for one, and believe material on this site infringes your copyright, send us a written notice that includes:</p><ol><li>your physical or electronic signature;</li><li>a description of the copyrighted work you claim has been infringed;</li><li>the exact page or link where the material appears, so we can find it;</li><li>your name, address, telephone number and email address;</li><li>a statement that you have a good-faith belief the use is not authorized by the copyright owner, its agent or the law;</li><li>a statement, made under penalty of perjury, that the information in your notice is accurate and that you are authorized to act for the copyright owner.</li></ol><h2>Where to send it</h2><p>Send your notice to ${cm()}. Incomplete notices may delay our response.</p><h2>What happens next</h2><p>When we receive a valid notice, we will promptly remove or disable access to the material and may tell the person who added it.</p><h2>Counter-notice</h2><p>If you believe material was removed by mistake or misidentification, you may send us a counter-notice with your signature, a description of the removed material and where it appeared, a statement under penalty of perjury that you believe it was removed in error, and your name, address and phone number. We may restore the material if the original complainant does not take legal action within the period the law allows.</p><h2>Repeat infringers</h2><p>In appropriate circumstances, we will end access for people who repeatedly infringe the rights of others.</p><h2>Misrepresentations</h2><p>Knowingly submitting a false notice or counter-notice may have legal consequences, including liability for damages.</p>`},
cookies:{t:'Cookie Settings',u:UPD,b:()=>`<p>Here is exactly what Kap Manga stores on your device, and what it does not.</p><div class="note"><strong>No tracking.</strong> Kap Manga does not set advertising, analytics or tracking cookies, so there is nothing to opt out of.</div><h2>What is stored on your device</h2><ul><li><strong>Browser storage (IndexedDB, with local storage as a fallback).</strong> Essential. It holds the site library and settings so they are still there when you return. It never leaves your device through this site.</li><li><strong>Cookies.</strong> Kap Manga itself does not set any cookies.</li></ul><h2>Third-party requests</h2><ul><li><strong>Google Fonts.</strong> Loads the Inter typeface. Google may receive your IP address when your browser fetches the font files.</li></ul><h2>Your choices</h2><p>You can clear stored data at any time in your browser settings, usually under “Clear browsing data” or “Site settings”. Clearing it removes the saved library from this device. You can also block third-party requests with a browser extension, and the site will use a standard system font instead.</p><p>Read more in our <a href="privacy.html">Privacy Policy</a>.</p>`}};
