const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('kapmanga',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

const mt=s=>`<div class="meta">${s.rating?`<b>★ ${esc(s.rating)}</b> · `:''}${esc([s.year,s.type].filter(Boolean).join(' · '))}</div>`;

privacy:{t:'Privacy Policy',u:UPD,b:()=>`<p>Your privacy matters to us. This policy explains what information Kap Manga handles and the choices you have.</p><h2>1. The short version</h2><p>You do not need an account to use Kap Manga. We do not sell your personal information, and we do not use advertising or tracking cookies.</p><h2>2. Information we handle</h2><ul><li><strong>Messages you send us.</strong> If you contact us or report an issue, we receive the details you choose to include, such as your name and email address.</li><li><strong>Data stored on your device.</strong> The site saves its library data and settings in your browser storage on your own device. See our <a href="cookies.html">Cookie Settings</a> page for details.</li><li><strong>Technical data.</strong> Our hosting provider may keep standard server logs, such as IP address, browser type and the pages requested, for security and reliability.</li></ul><h2>3. How we use information</h2><ul><li>To reply to your messages and fix problems you report.</li><li>To keep the site secure and working properly.</li></ul><h2>4. Third-party services</h2><p>The site loads the Inter typeface from Google Fonts. When your browser requests the font files, Google receives technical information such as your IP address. Material linked from the site may also be hosted by third parties with their own privacy practices.</p><h2>5. Retention</h2><p>We keep messages only as long as needed to respond and follow up. Data saved in your browser stays on your device until you clear it.</p><h2>6. Children</h2><p>Kap Manga is not directed at children under 13, and we do not knowingly collect personal information from them.</p><h2>7. Your rights</h2><p>Depending on where you live, you may have the right to ask what information we hold about you, to correct it or to have it deleted. Contact us and we will help.</p><h2>8. Changes to this policy</h2><p>We may update this policy from time to time. The date at the top shows the latest version.</p><h2>9. Contact</h2><p>For privacy questions, use the <a href="contact.html">Contact</a> page${mail()?' or write to '+cm():''}.</p>`},

  curLib().forEach(o=>{if(o.id!=null)byId.set(String(o.id),o);const s=slug(o.title);if(s&&!bySlug.has(s))bySlug.set(s,o)});
  const recs=items.map((it,i)=>{const id=idOf(it),ex=byId.get(id)||bySlug.get(slug(it.title))||null;return{it,i,id,ex}});
  const now=Date.now();recs.forEach(r=>{r.out=build(r,now)});
  const pick=recs.filter(r=>!S.onlyChanged||r.isNew||r.changed||(S.refresh&&needAL()&&r.ex));
  last={recs,pick,size:S.batch,bi:0,added:new Set(),now,fetched:new Set(),tried:new Set(),unm:{},net:false,stopped:false};abort=false;
  $('#pmsg').textContent='Done.';
  showRes()}

/* Test links button */
const LTL={shared:'Shared id',anime:'Anime link only',bad:'Unreadable link',nolink:'No link'};
function linkReport(){const T=tested||items,P=T.filter(i=>issuesOf(i).length),d=new Date().toISOString().slice(0,10);
  return `Kap Manga link test (${d})${testLib?' - current library':''}\n${T.length} titles checked, ${P.length} with link problems`+(orphList.length?`, ${orphList.length} link${orphList.length===1?'':'s'} with no title`:'')+'\n\n'+
   P.map((it,k)=>`${k+1}. ${it.title} [${it.section}]\n`+issuesOf(it).map(x=>`   ${x.short}: ${x.msg}\n   Fix: ${x.fix}`).join('\n')).join('\n\n')+
   (orphList.length?'\n\nLinks with no # title above them (skipped):\n'+orphList.map(o=>`   line ${o.n}: ${o.text}`).join('\n'):'')+'\n'}
/* no .txt needed: test the current library instead (reads ids and titles only) */
function libItems(){const rows=curLib().filter(o=>o&&o.title).map(o=>({title:String(o.title),section:o.status||'Library',id:o.id==null?'':String(o.id),issues:[]})),byId=new Map(),byT=new Map(),key=r=>slug(r.title)||r.title.toLowerCase();
  rows.forEach(r=>{if(r.id){if(!byId.has(r.id))byId.set(r.id,[]);byId.get(r.id).push(r)}const k=key(r);if(!byT.has(k))byT.set(k,[]);byT.get(k).push(r)});
  rows.forEach(r=>{const sid=r.id&&byId.get(r.id),st=byT.get(key(r));
    if(sid&&sid.length>1){const o=sid.find(x=>x!==r);r.issues.push({k:'shared',short:'Shared id',msg:`Has the same id (${r.id}) as \u201c${o.title}\u201d. When imported, one of them replaces the other.`,fix:'Remove the duplicate, or give one of them its own id in the admin.'})}
    else if(st.length>1){const o=st.find(x=>x!==r);r.issues.push({k:'same',short:'Same title',msg:`Has the same name as another title in your library (id ${o.id||'none'}).`,fix:'Check if it is a duplicate and remove one in the admin.'})}
    if(!r.id||/^t-/.test(r.id))r.issues.push({k:'nolink',short:'No link',msg:'This title has no AniList, MAL or MangaUpdates link. Its id is made from its name.',fix:'Optional. Add its manga link under the # title in your export if you want it matched more reliably.'})});
  return rows}
/* type the correct link for a problem title and save it */
function linkParse(v){v=String(v||'').trim();let m;
  if(m=v.match(/anilist\.co\/manga\/(\d+)/i))return{k:'al',n:m[1],url:'https://anilist.co/manga/'+m[1]};
  if(m=v.match(/myanimelist\.net\/manga\/(\d+)/i))return{k:'mal',n:m[1],url:'https://myanimelist.net/manga/'+m[1]};
  if(m=v.match(/mangaupdates\.com\/series\/([a-z0-9]+)/i))return{k:'mu',n:m[1],url:'https://www.mangaupdates.com/series/'+m[1]};
  if(/\/anime\/\d+/i.test(v))return{err:'That is an anime link. Use the manga page instead.'};
  return{err:'Paste a link like anilist.co/manga/105398 or myanimelist.net/manga/121496.'}}
async function fixLink(i,val){const it=tested&&tested[i];if(!it)return;const p=linkParse(val);
  if(p.err){toast(p.err);return}
  const sc=document.querySelector('#ltest .jm-att'),top=sc?sc.scrollTop:0;
  if(!testLib){
    const ta=$('#src'),L=ta.value.split('\n'),t=L[it.ln-1];
    if(!t||!/^\s*#\s+/.test(t)||t.replace(/^\s*#\s+/,'').trim()!==it.title){toast('Could not find that title in your text. Press Test links again.');return}
    let e=it.ln;while(e<L.length&&!/^\s*#/.test(L[e]))e++;
    const keep=L.slice(it.ln,e).filter(x=>!/https?:\/\/|www\.|anilist|myanimelist|mangaupdates/i.test(x));
    L.splice(it.ln,e-it.ln,p.url,...keep);
    ta.value=L.join('\n');readSrc();
  }else{
    if(lib){toast('Saving works on the library kept in this browser, not on a chosen file.');return}
    const o=db.series.find(x=>String(x.id==null?'':x.id)===it.id&&String(x.title)===it.title),id=p.k+'-'+p.n;
    if(!o){toast('Could not find that title in your library');return}
    if(db.series.some(x=>x!==o&&String(x.id)===id)){toast('Another title in your library already uses that link');return}
    const old=String(o.id);o.id=id;o.updated=Date.now();
    Object.keys(db.top||{}).forEach(k=>{if(Array.isArray(db.top[k]))db.top[k]=db.top[k].map(x=>x===old?id:x)});
    if(Array.isArray(db.featured))db.featured=db.featured.map(x=>x===old?id:x);
    await save()}
  testLinks();const sc2=document.querySelector('#ltest .jm-att');if(sc2)sc2.scrollTop=top;
  toast(testLib?'Link saved to your library':'Link added to your text'+(last?'. Press Make JSON again to use it':''))}
/* search / open buttons for a problem title (open in a new tab) */
function linkBtns(it){const q=encodeURIComponent(it.title);let al=it.al,mal=it.mal,m;
  if(testLib&&it.id){if(m=it.id.match(/^al-(\d+)$/))al=m[1];else if(m=it.id.match(/^mal-(\d+)$/))mal=m[1]}
  const a=t=>`target="_blank" rel="noopener noreferrer"`;
  return `<div class="jm-lk"><a href="https://anilist.co/search/manga?search=${q}" ${a()}>Search AniList \u2197</a><a href="https://myanimelist.net/manga.php?q=${q}&cat=manga" ${a()}>Search MAL \u2197</a>`+
    (al?`<a href="https://anilist.co/manga/${encodeURIComponent(al)}" ${a()}>Open current AniList link \u2197</a>`:'')+
    (mal?`<a href="https://myanimelist.net/manga/${encodeURIComponent(mal)}" ${a()}>Open current MAL link \u2197</a>`:'')+`</div>`}
function testLinks(){readSrc();readS();const el=$('#ltest');
  testLib=!items.length;
  if(testLib){if(!curLib().length){needSrc();return}tested=libItems()}else tested=items;
  const T=tested,P=T.filter(i=>issuesOf(i).length);
  if(!P.length&&!orphList.length){el.innerHTML=`<div class="jm-note jm-g" style="margin-top:14px">${testLib?`All ${T.length} titles in your current library have a link and no id or name is shared.`:`All ${T.length} titles have a readable manga link and no link is shared.`}</div>`;return}
  const by={};P.forEach(i=>issuesOf(i).forEach(x=>{by[x.short]=(by[x.short]||0)+1}));
  if(orphList.length)by['No title above']=orphList.length;
  el.innerHTML=`<div class="jm-sub">Link test${testLib?' (current library)':''} \u00b7 ${P.length} of ${T.length} titles${orphList.length?` + ${orphList.length} stray link${orphList.length===1?'':'s'}`:''}</div>
  <div class="jm-chips" style="margin-top:0">${Object.entries(by).map(([k,n])=>`<span class="jm-w">${esc(k)} <b>${n}</b></span>`).join('')}</div>
  <p class="jm-how">${testLib?'No .txt was added, so your current library was checked. Nothing was fetched and nothing was changed.':'Checked from the text only. Nothing was fetched and nothing was changed. Titles with a problem are still added when you press Make JSON, so fix them in your export first if you want them clean.'}</p>
  <div class="jm-acts" style="margin:12px 0"><button class="jm-btn" id="lrep">Copy report</button><button class="jm-btn" id="lrepdl">Download report</button></div>
  <div class="jm-att" style="max-height:460px;overflow:auto">${P.slice(0,150).map(it=>`<div class="jm-ai"><div class="jm-ah"><b>${esc(it.title)}</b><span class="jm-tg">${esc(it.section)}</span>${issuesOf(it).map(x=>`<span class="jm-tg jm-wn">${esc(x.short)}</span>`).join('')}</div>${issuesOf(it).map(x=>`<p>${esc(x.msg)}</p><p><b>What to do:</b> ${esc(x.fix)}</p>`).join('')}${linkBtns(it)}${testLib&&lib?'<p>Choose \u201cuse the library saved in this browser\u201d to save links here.</p>':`<div class="jm-fx"><input type="text" placeholder="Paste the correct AniList or MAL link" data-fixin="${T.indexOf(it)}" autocomplete="off"><button class="jm-btn" data-fix="${T.indexOf(it)}">Save link</button></div>`}</div>`).join('')}${orphList.length?`<div class="jm-ai"><div class="jm-ah"><b>Links with no # title above them</b><span class="jm-tg jm-wn">Skipped</span></div>${orphList.slice(0,30).map(o=>`<p>Line ${o.n}: ${esc(o.text.length>100?o.text.slice(0,100)+'\u2026':o.text)}</p>`).join('')}<p><b>What to do:</b> Put a # title line above each link.</p></div>`:''}</div>${P.length>150?`<div class="jm-more">Showing the first 150 of ${P.length}. The report has all of them.</div>`:''}`}

/* parts of 80 (or the size you chose) */
const nParts=()=>Math.max(1,Math.ceil(last.pick.length/last.size));
const partOf=bi=>last.pick.slice(bi*last.size,(bi+1)*last.size);
function jsonOf(bi){const series=partOf(bi).map(r=>r.out);
  return JSON.stringify({app:'Kap Manga',version:1,genres:uniq(series.flatMap(x=>x.genres)).sort((a,b)=>a.localeCompare(b)),tags:uniq(series.flatMap(x=>x.tags)).sort((a,b)=>a.localeCompare(b)),series},null,1)}

function showRes(){const{recs,pick}=last,nw=recs.filter(r=>r.isNew).length,up=recs.filter(r=>!r.isNew&&r.changed).length,same=recs.length-nw-up,n=nParts();
  $('#res').hidden=false;
  $('#resHint').textContent=(S.onlyChanged?`${pick.length} of ${recs.length} titles are in the parts.`:`All ${recs.length} titles are in the parts.`)+` ${n} part${n===1?'':'s'} of up to ${last.size}.`+(S.onlyChanged&&pick.length<recs.length?` Only new and changed titles are included, so the other ${recs.length-pick.length} are left out. To split all ${recs.length} into parts of ${last.size}, turn off \u201cOnly include new and changed titles\u201d in step 2 and press Make JSON again.`:'');
  $('#sum').innerHTML=[[nw,'New titles'],[up,'Changed'],[same,'Unchanged'],[n,'Parts']].map(([v,l])=>`<div><b>${v.toLocaleString()}</b><span>${l}</span></div>`).join('');
  showPart(0);$('#res').scrollIntoView({behavior:'smooth',block:'start'})}

function showPart(bi){if(!last)return;const n=nParts();bi=Math.max(0,Math.min(n-1,bi));last.bi=bi;
  const L=partOf(bi),json=jsonOf(bi),a=L.length?bi*last.size+1:0,b=bi*last.size+L.length;
  $('#bnum').textContent=L.length?`Part ${bi+1} of ${n} · titles ${a}–${b} of ${last.pick.length} · ${(json.length/1024).toFixed(0)} KB`:'Nothing to export';
  $('#prev').disabled=bi===0;
  const rest=Math.min(last.size,last.pick.length-(bi+1)*last.size);
  $('#next').disabled=bi>=n-1;$('#next').textContent=bi>=n-1?'Last part':`Next ${rest}`;
  const ab=$('#add'),done=last.added.has(bi);ab.disabled=!L.length||done;ab.textContent=done?'Added ✓':'Add this part to my library';
  $('#out').value=json;drawRows();fmsgDraw();
  if(needAL()&&!busy&&!last.tried.has(bi)&&L.length)ensureImages(bi)}

function drawRows(){if(!last)return;const f=$('#flt').value,base=last.bi*last.size;
  const L=partOf(last.bi).map((r,i)=>({r,n:base+i+1})).filter(({r})=>f==='all'?true:f==='new'?r.isNew:f==='prob'?issuesOf(r.it).length>0:f==='nom'?(needAL()&&last.tried.has(last.bi)&&wantsFetch(r)):(!r.isNew&&r.changed));
  $('#fcount').textContent=`${L.length} title${L.length===1?'':'s'} in this part`;
  $('#rows').innerHTML=L.map(({r,n})=>{const o=r.out,res=r.isNew?'<span class="jm-tg jm-ac">New</span>':r.changed?'<span class="jm-tg jm-ac">Changed</span>':'<span class="jm-tg">Unchanged</span>';
    const is=issuesOf(r.it),lk=is.length?`<span class="jm-tg jm-wn" title="${esc(is[0].msg)}">${esc(is[0].short)}</span>`:'<span class="jm-tg jm-ok">OK</span>';
    const HOWL={id:'AniList link',mal:'MAL link',jikan:'MAL (Jikan)',mu:'MangaUpdates',search:'Title search'},al=r.m?`<span class="jm-tg jm-ok">${HOWL[r.how]||'Found'}</span>`:(needAL()&&last.tried.has(last.bi)&&wantsFetch(r))?'<span class="jm-tg jm-wn">No match</span>':'<span class="jm-tg">Not fetched</span>';
    return `<tr><td class="jm-mut">${n}</td><td class="jm-t" title="${esc(o.title)}">${esc(o.title)}</td><td>${esc(o.type)}</td><td>${esc(o.status)}</td><td>${lk}</td><td>${al}</td><td>${res}</td></tr>`}).join('')||'<tr><td colspan="7" class="jm-mut" style="padding:20px">Nothing to show here.</td></tr>'}

/* put one part straight into this browser's library */
async function addNow(){if(!last)return;const bi=last.bi,L=partOf(bi);if(!L.length||last.added.has(bi))return;
  if(!await ensureImages(bi))return;
  const o=JSON.parse(jsonOf(bi));let n=0;
  o.series.forEach(x=>{const s=norm(x),i=db.series.findIndex(y=>y.id===s.id);i>=0?db.series[i]=s:db.series.push(s);n++});
  db.genres=db.genres||[];db.tags=db.tags||[];
  (o.genres||[]).forEach(g=>{g=String(g).trim();if(g&&!db.genres.includes(g))db.genres.push(g)});
  (o.tags||[]).forEach(g=>{g=String(g).trim();if(g&&!db.tags.includes(g))db.tags.push(g)});
  await save();last.added.add(bi);const pr=L.filter(r=>issuesOf(r.it).length).length;toast(`Added ${n} title${n===1?'':'s'} to your library`+(pr?` (${pr} with link problems)`:''));
  if(last&&last.bi===bi)showPart(bi);libNote()}

/* downloads */
function fileName(bi){const d=new Date(),p=n=>String(n).padStart(2,'0'),n=nParts(),w=Math.max(2,String(n).length);
  return `kap-manga-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`+(n>1?`-part-${String(bi+1).padStart(w,'0')}-of-${String(n).padStart(w,'0')}`:'')+'.json'}
function saveAs(json,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

async function takeFile(f,cb){if(!f)return;cb(await f.text(),f.name)}
const setSrc=(t,name)=>{if(/^\s*[\[{]/.test(t)){try{JSON.parse(t);readLib(t,name);toast('That is a library .json, so it was used for step 2');return}catch(e){}}$('#src').value=t;readSrc()};
const needSrc=()=>{toast('Step 1 first: add your Comix .txt');$('#stat').innerHTML='<span class="jm-w">Add your Comix .txt export here first. The library file in step 2 only shows what you already have.</span>';$('#src').focus()};
function open(){
  clearInterval(heroT);
  items=[];secs={};lib=null;libName='';last=null;abort=false;busy=false;
  document.querySelector('#main').innerHTML=`<div class="wrap"><div id="jmk">${TPL}</div>${foot()}</div>`;
  applyS();drawMap();libNote();
  $('#srcFile').addEventListener('change',e=>takeFile(e.target.files[0],setSrc));
  $('#libFile').addEventListener('change',e=>takeFile(e.target.files[0],readLib));
  [['#dz',setSrc],['#dzl',readLib]].forEach(([id,cb])=>{const z=$(id);
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('on')});
    z.addEventListener('dragleave',()=>z.classList.remove('on'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('on');takeFile(e.dataTransfer.files[0],cb)})});
  let dbt;$('#src').addEventListener('input',()=>{clearTimeout(dbt);dbt=setTimeout(readSrc,200)});
  $('#go').addEventListener('click',run);
  $('#test').addEventListener('click',testLinks);
  $('#fget').addEventListener('click',()=>{if(last)ensureImages(last.bi,true)});
  $('#fstop').addEventListener('click',()=>{abort=true;$('#fmsg').textContent='Stopping…'});
  $('#ltest').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='lrep'){const t=linkReport();try{await navigator.clipboard.writeText(t)}catch(err){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast('Report copied')}
    else if(b.id==='lrepdl'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([linkReport()],{type:'text/plain'}));a.download='kap-manga-link-test-'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Report downloaded')}
    else if(b.dataset.fix!==undefined){const inp=document.querySelector(`#ltest input[data-fixin="${b.dataset.fix}"]`);fixLink(+b.dataset.fix,inp&&inp.value)}});
  $('#ltest').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.fixin!==undefined){e.preventDefault();fixLink(+e.target.dataset.fixin,e.target.value)}});
  $('#flt').addEventListener('change',drawRows);
  $('#add').addEventListener('click',addNow);
  $('#prev').addEventListener('click',()=>{if(last)showPart(last.bi-1)});
  $('#next').addEventListener('click',()=>{if(!last)return;showPart(last.bi+1);$('#bnum').scrollIntoView({behavior:'smooth',block:'center'})});
  document.querySelectorAll('#jmk .jm-st input,#jmk .jm-st select').forEach(el=>{if(el.type!=='file'&&el.id!=='flt')el.addEventListener('change',readS)});
  $('#dl').addEventListener('click',async()=>{if(!last)return;if(!await ensureImages(last.bi))return;saveAs(jsonOf(last.bi),fileName(last.bi));toast('Downloaded '+fileName(last.bi))});
  $('#dlAll').addEventListener('click',async()=>{if(!last)return;const n=nParts();for(let i=0;i<n&&last;i++){if(!await ensureImages(i))break;saveAs(jsonOf(i),fileName(i));await sleep(500)}toast(`Downloaded ${n} part${n===1?'':'s'}`)});
  $('#cp').addEventListener('click',async()=>{if(!last)return;if(!await ensureImages(last.bi))return;const j=jsonOf(last.bi);try{await navigator.clipboard.writeText(j)}catch(e){const t=$('#out');t.select();document.execCommand('copy')}toast('JSON copied')});
  scrollTo(0,0)}
return{open,stop:()=>{abort=true}}
})();
const jmOn=()=>KAP==='home'&&location.hash==='#json-maker';
/* ---------- ROUTE ---------- */
function route(){if(KAP==='home'){const m=location.hash.match(/^#type-(.+)$/),t=m?decodeURIComponent(m[1]):'All';filter=TYPES.includes(t)?t:'All'}if(!jmOn())JMK.stop();nav();if(jmOn()){JMK.open();return}KAP==='admin'?admin():PG[KAP]?page(KAP):front()}
addEventListener('hashchange',()=>{q='';$('#modal').innerHTML='';route()});
load().then(d=>{if(d&&Array.isArray(d.series)){db.series=d.series.map(norm);db.genres=Array.isArray(d.genres)?d.genres:[];db.gseed=d.gseed;db.tags=Array.isArray(d.tags)?d.tags:[];db.top=d.top&&typeof d.top==='object'?d.top:{};db.featured=Array.isArray(d.featured)?d.featured.filter(x=>typeof x==='string').slice(0,5):[];db.settings=d.settings&&typeof d.settings==='object'?d.settings:{}}if(!db.gseed){db.genres=[...new Set([...db.genres,...DEFG])];db.gseed=1;save()}route()});
</script>
