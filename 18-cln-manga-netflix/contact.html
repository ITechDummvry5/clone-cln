<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Contact us · Kap Manga</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="kap.css">
</head>
<body>
<div id="nav"></div><div id="main"></div><div id="modal"></div><div id="toast"></div>
<noscript>Kap Manga needs JavaScript to run.</noscript>
<script src="render-template.js"></script>
<script>window.KAP_PAGE='contact';</script>
<script>
const KAP=window.KAP_PAGE||'home';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES=['Manga','Manhwa','Manhua','One Shot'],STAT=['Ongoing','Completed','Hiatus','Cancelled'];
let db={series:[]},cur=null,filter='All',q='',heroT=null,armed='';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)};
const bg=u=>u?`style="background-image:url('${esc(u).replace(/'/g,'%27')}')"`:'';
/* storage: IndexedDB (big images) with localStorage fallback */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('kapmanga',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const g=d.transaction('kv').objectStore('kv').get('db');g.onsuccess=()=>r(g.result);g.onerror=()=>r()})}catch(e){try{return JSON.parse(localStorage.getItem('kapmanga'))}catch(e2){}}}
async function save(){try{const t0=performance.now(),d=await idb();await new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(db,'db');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});PF.save=performance.now()-t0}catch(e){try{localStorage.setItem('kapmanga',JSON.stringify(db))}catch(e2){toast('Could not save in this browser')}}}
const norm=o=>({id:String(o.id||uid()),title:String(o.title||'Untitled'),altTitles:o.altTitles||'',type:TYPES.includes(o.type)?o.type:'Manga',status:STAT.includes(o.status)?o.status:'Ongoing',author:o.author||'',year:o.year||'',rating:o.rating||'',genres:Array.isArray(o.genres)?o.genres:[],description:o.description||'',cover:o.cover||'',banner:o.banner||'',chapters:(Array.isArray(o.chapters)?o.chapters:[]).map(c=>({number:c.number==null?'':c.number,title:c.title||'',pages:Array.isArray(c.pages)?c.pages:[]})),chaptersOff:!!o.chaptersOff,tags:Array.isArray(o.tags)?o.tags.map(String):[],added:o.added||Date.now(),updated:o.updated||Date.now()});
const readImg=(f,max)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.onerror=()=>r(null);i.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});
/* ---------- NAV ---------- */
let bt='';
function nav(){if(KAP==='admin'){$('#nav').innerHTML='';return}
$('#nav').innerHTML=KapTemplate.renderNav({types:TYPES,filter,q})}
/* ---------- FRONT ---------- */
const CAP=24,PAGE=48,ADM=60,sq={},PF={render:0,save:0},KEY=new WeakMap();
const key=s=>KEY.get(s)||(KEY.set(s,(s.title+' '+s.altTitles+' '+s.genres.join(' ')+' '+(s.tags||[]).join(' ')).toLowerCase()),KEY.get(s));
const lbg=u=>u?`data-bg="${esc(u)}"`:'';
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.style.backgroundImage=`url("${t.dataset.bg.replace(/"/g,'%22')}")`;t.removeAttribute('data-bg');io.unobserve(t)}}),{rootMargin:'300px'});
const lazy=r=>(r||document).querySelectorAll('[data-bg]').forEach(el=>io.observe(el));
function pager(L){const g=$('#gg'),s=$('#gs');if(!g||!s)return;let n=0;const more=()=>{const c=L.slice(n,n+PAGE);g.insertAdjacentHTML('beforeend',c.map(lcard).join(''));n+=c.length;lazy(g);if(n>=L.length){s.remove();ob.disconnect()}};const ob=new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'800px'});more();if(n<L.length)ob.observe(s)}
let fs='',ft='',pg=0,selMode=false;const sel=new Set(),PS=25;
const filt=()=>{const ql=q.toLowerCase();return db.series.filter(s=>(!fs||s.status===fs)&&(!ft||s.type===ft)&&(!ql||s.title.toLowerCase().includes(ql)||(s.altTitles||'').toLowerCase().includes(ql)))};
const gtags=s=>s.genres.slice(0,2).map(g=>`<span class="tg">${esc(g)}</span>`).join('')+(s.genres.length>2?`<span class="tg m">+${s.genres.length-2}</span>`:'')||'<span class="mut">—</span>';
function listH(){const a=filt(),pages=Math.max(1,Math.ceil(a.length/PS));if(pg>=pages)pg=pages-1;if(pg<0)pg=0;const r=a.slice(pg*PS,pg*PS+PS);
return `${selMode?bulkH():''}<div class="tbw"><table class="tb2${selMode?' sel':''}"><thead><tr>${selMode?`<th class="ck" data-act="selall"><input type="checkbox" ${r.length&&r.every(s=>sel.has(s.id))?'checked':''}></th>`:''}<th>Title</th><th>Type</th><th>Status</th><th>Genres</th><th>Year</th><th>Rating</th><th>Ch.</th></tr></thead><tbody>${r.map(s=>`<tr data-act="${selMode?'selrow':'edit'}" data-id="${s.id}" class="${cur&&cur.id===s.id?'on':''}${sel.has(s.id)?' sl':''}">${selMode?`<td class="ck"><input type="checkbox" ${sel.has(s.id)?'checked':''} tabindex="-1"></td>`:''}<td><div class="tc2"><div class="th2" ${bg(s.cover)}></div><div><b>${esc(s.title)}</b>${s.altTitles?`<small>${esc(s.altTitles)}</small>`:''}</div></div></td><td><span class="tg">${esc(s.type)}</span></td><td><span class="tg s ${s.status}">${s.status}</span></td><td>${gtags(s)}</td><td>${esc(s.year)||'—'}</td><td>${s.rating?'★ '+esc(s.rating):'—'}</td><td>${s.chaptersOff?'<span class="tg m">Off</span>':s.chapters.length}</td></tr>`).join('')||`<tr><td colspan="${selMode?8:7}" class="mut" style="padding:36px;text-align:center">${db.series.length?'No titles match your filters.':'No titles yet. Click “+ New title” to add one.'}</td></tr>`}</tbody></table></div><div class="pgn"><span class="mut">${a.length?pg*PS+1:0}–${Math.min(a.length,pg*PS+PS)} of ${a.length}</span><div><button class="btn gh sm" data-act="pp" ${pg?'':'disabled'}>‹ Prev</button><button class="btn gh sm" data-act="pn" ${pg<pages-1?'':'disabled'}>Next ›</button></div></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act=pp],[data-act=pn]');if(!t||t.disabled)return;pg+=t.dataset.act==='pn'?1:-1;$('#lst').innerHTML=listH();$('#lst').scrollIntoView({block:'start'})});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='fs'||t.id==='ft'){if(t.id==='fs')fs=t.value;else ft=t.value;pg=0;$('#lst').innerHTML=listH()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur&&KAP==='admin'&&!$('#modal').innerHTML){cur=null;admin()}});
const bulkH=()=>`<div class="bulk"><span><b>${sel.size}</b> selected</span><span class="sp"></span><button class="tb-btn dgr" data-act="bdel" ${sel.size?'':'disabled'}>${ic(IC.trash)}<span class="tl">${armed==='bdel'?'Click again to delete '+sel.size:'Delete selected'}</span></button><button class="tb-btn" data-act="selmode">Cancel</button></div>`;
document.addEventListener('click',e=>{const t=e.target.closest('[data-act=selmode],[data-act=selrow],[data-act=selall],[data-act=bdel]');if(!t)return;const a=t.dataset.act,r=()=>{$('#lst').innerHTML=listH()};
if(a==='selmode'){selMode=!selMode;sel.clear();armed='';const b=document.querySelector('.sbtn');if(b)b.classList.toggle('on',selMode);r()}
else if(a==='selrow'){const id=t.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);armed='';r()}
else if(a==='selall'){const rows=filt().slice(pg*PS,pg*PS+PS),all=rows.every(s=>sel.has(s.id));rows.forEach(s=>all?sel.delete(s.id):sel.add(s.id));r()}
else if(a==='bdel'&&sel.size){if(armed!=='bdel'){armed='bdel';r();return}db.series=db.series.filter(s=>!sel.has(s.id));if(cur&&sel.has(cur.id))cur=null;const n=sel.size;sel.clear();armed='';selMode=false;save();toast('Deleted '+n+' title(s)');admin()}});
function perfModal(){const n=db.series.length,bytes=new Blob([JSON.stringify(db)]).size,nodes=document.querySelectorAll('*').length;
$('#modal').innerHTML=`<div class="modal" data-act="close"><div class="box" data-stop><button class="x" data-act="close">×</button><h2 style="margin-top:0">Performance lab</h2><p class="mut">Stress-test the site with fake titles (no images, no chapters). Open the homepage once to record its render time.</p><div class="pf">${[['Titles',n],['Data size',(bytes/1024).toFixed(0)+' KB'],['DOM nodes',nodes],['Home render',PF.render.toFixed(1)+' ms'],['Last save',PF.save.toFixed(1)+' ms']].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div><div class="acts"><button class="btn ac sm" data-act="bgen">Add 1,200 test titles</button><button class="btn gh sm" data-act="bclr">Remove test titles</button><button class="btn gh sm" data-act="perf">Refresh</button></div><div class="mut" style="font-size:12px">Targets: home render under 50 ms, DOM under about 3,000 nodes, save under 100 ms.</div></div></div>`}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,r=arr=>arr[Math.random()*arr.length|0];
if(a==='perf')perfModal();
if(a==='bgen'){db.series=db.series.filter(s=>!s.id.startsWith('bench-'));const G=allG();db.series.push(...Array.from({length:1200},(_,i)=>norm({id:'bench-'+i,title:'Test Title '+(i+1),type:r(TYPES),status:r(STAT),year:String(2000+i%27),rating:(6+Math.random()*3.9).toFixed(1),genres:[r(G),r(G)],description:'Benchmark entry.',added:Date.now()-i*1000})));await save();admin();perfModal()}
if(a==='bclr'){db.series=db.series.filter(s=>!s.id.startsWith('bench-'));cur=null;await save();admin();perfModal()}});
const mt=s=>`<div class="meta">${s.rating?`<b>★ ${esc(s.rating)}</b> · `:''}${esc([s.year,s.type].filter(Boolean).join(' · '))}</div>`;
const lcard=s=>`<div class="lc" data-act="open" data-id="${s.id}"><div class="lp" ${lbg(s.banner||s.cover)}>${s.banner||s.cover?'':`<em>${esc(s.title[0]||'?')}</em>`}${s.status==='Ongoing'&&!s.chaptersOff?'<span class="nw">New chapter</span>':''}</div><h3>${esc(s.title)}</h3>${mt(s)}</div>`;
const rk=n=>`<span class="rk">TOP<br><big>${n}</big></span>`;
const tcard=(s,n)=>`<div class="tc" data-act="open" data-id="${s.id}"><div class="tv" ${lbg(s.cover||s.banner)}>${rk(n)}</div><h3>${esc(s.title)}</h3>${mt(s)}</div>`;
const bcard=(s,n)=>`<div class="tb" data-act="open" data-id="${s.id}"><div class="tv" ${lbg(s.banner||s.cover)}>${rk(n)}<div class="ti"><h4>${esc(s.title)}</h4><small>${esc([s.author,s.genres.slice(0,3).join(', ')].filter(Boolean).join(' · '))}</small><p>${esc(s.description)}</p><span class="btn gh sm">${s.chaptersOff?'View':'Read now'}</span></div></div><h3>${esc(s.title)}</h3>${mt(s)}</div>`;
const rowL=(t,a,ar)=>a.length?`<section class="r"><h2>${t}${ar?' ›':''}</h2><div class="row">${a.slice(0,CAP).map(lcard).join('')}</div></section>`:'';
function front(){const t0=performance.now();clearInterval(heroT);const S=db.series,m=$('#main'),nv=document.querySelector('#nav nav');
if(!S.length){nv&&nv.classList.remove('ov');m.innerHTML=`<div class="empty"><h2>Welcome to Kap Manga</h2><p>Your library is empty. Add your first title in the admin panel.</p><a class="btn ac" href="admin.html">Open Admin</a></div>`;return}
if(filter!=='All'||q){nv&&nv.classList.remove('ov');const L=S.filter(s=>(filter==='All'||s.type===filter)&&(!q||key(s).includes(q.toLowerCase())));
m.innerHTML=`<div class="wrap"><section class="r"><h2>${filter==='All'?'Results':esc(filter)}${q?` for “${esc(q)}”`:''}</h2>${L.length?`<div class="grid l" id="gg"></div><div id="gs" class="mut" style="text-align:center;padding:24px">Loading…</div>`:'<p class="mut">Nothing found.</p>'}</section>${foot()}</div>`;pager(L);return}
nv&&nv.classList.add('ov');
const latest=[...S].sort((a,b)=>b.added-a.added),hs=latest.slice(0,5),by=(a,b)=>(+b.rating||0)-(+a.rating||0)||b.added-a.added,top=[...S].sort(by).slice(0,10);
const types=TYPES.filter(t=>S.some(s=>s.type===t));if(!types.includes(bt))bt=types[0];
const gc={};S.forEach(s=>s.genres.forEach(g=>(gc[g]=gc[g]||s)));const gs=Object.keys(gc).slice(0,12);
m.innerHTML=`<div class="hero" id="hero"></div><div class="wrap">${topSec(S,top)}${rowL('Latest updates',latest,1)}${rowL('Ongoing series',S.filter(s=>s.status==='Ongoing'))}<section class="r"><div class="hd"><h2>Browse by type</h2><div class="pls">${types.map(t=>`<button class="tp ${t===bt?'on':''}" data-act="bt" data-t="${t}">${t}</button>`).join('')}</div></div><div class="row">${S.filter(s=>s.type===bt).slice(0,CAP*2).map(lcard).join('')}</div></section>${rowL('Completed',S.filter(s=>s.status==='Completed'),1)}${rowL('Top rated',[...S].filter(s=>+s.rating).sort(by).slice(0,12))}${gs.length?`<section class="r"><h2>Popular Genres ›</h2><div class="row">${gs.map(g=>`<div class="gt" data-act="genre" data-g="${esc(g)}" ${lbg(gc[g].banner||gc[g].cover)}><span>${esc(g)}</span></div>`).join('')}</div></section>`:''}${tagSec(S)}${foot()}</div>`;
let i=0,paused=false;const h=$('#hero');
const set=n=>{i=n;const s=hs[i];h.style.backgroundImage=`url('${(s.banner||s.cover||'').replace(/'/g,'%27')}')`;h.innerHTML=`<div class="in"><h1>${esc(s.title)}</h1><div class="bd"><span class="t10"><b>TOP</b>10</span><strong>#${i+1} in latest</strong></div><div class="meta">${s.rating?`<b>★ ${esc(s.rating)}</b><span class="dot">${esc(s.year||'')}</span>`:''}<span class="dot">${esc(s.type)}</span>${s.genres.slice(0,2).map(g=>`<span class="dot">${esc(g)}</span>`).join('')}<span class="q4">${esc(s.status)}</span></div><p>${esc(s.description)}</p><div><button class="btn" data-act="open" data-id="${s.id}">${s.chaptersOff?'▶ View':'▶ Read'}</button> <button class="btn gh" data-act="open" data-id="${s.id}">ⓘ More info</button></div></div><div class="ctl">${hs.map((_,k)=>`<i class="${k===i?'on':''}" data-act="hero" data-i="${k}"></i>`).join('')}<button class="btn gh sm" data-act="pause">${paused?'▶':'❚❚'}</button></div>`};
set(0);window.heroSet=set;window.heroPause=()=>{paused=!paused;set(i)};
heroT=setInterval(()=>{if(!paused&&hs.length>1&&$('#hero'))set((i+1)%hs.length)},6000);decorate();lazy($('#main'));PF.render=performance.now()-t0}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act=bt]');if(t){bt=t.dataset.t;front()}});
let dr=null;
addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x;if(Math.abs(dx)>5)dr.m=1;if(dr.m)dr.r.scrollLeft=dr.s-dx});
addEventListener('pointerup',()=>setTimeout(()=>{dr=null}));
function decorate(){document.querySelectorAll('#main .row').forEach(r=>{const w=document.createElement('div');w.className='rw';r.parentNode.insertBefore(w,r);w.appendChild(r);
w.insertAdjacentHTML('beforeend','<button class="ar l" aria-label="Previous">‹</button><button class="ar r2" aria-label="Next">›</button>');
const upd=()=>{const m=r.scrollWidth-r.clientWidth;w.classList.toggle('sl',r.scrollLeft>4);w.classList.toggle('sr',r.scrollLeft<m-4)};
r.addEventListener('scroll',upd,{passive:true});upd();setTimeout(upd,300);
w.querySelector('.l').onclick=()=>r.scrollBy({left:-r.clientWidth*.8,behavior:'smooth'});
w.querySelector('.r2').onclick=()=>r.scrollBy({left:r.clientWidth*.8,behavior:'smooth'});
r.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')dr={r,x:e.clientX,s:r.scrollLeft,m:0}});
r.addEventListener('click',e=>{if(dr&&dr.m){e.stopPropagation();e.preventDefault()}},true)})}
const foot=()=>KapTemplate.renderFooter({types:TYPES,titles:db.series.length,chapters:db.series.reduce((a,s)=>a+(s.chaptersOff?0:s.chapters.length),0)});
document.addEventListener('click',e=>{if(e.target.closest('.fx [data-act],.fx [data-top]'))scrollTo({top:0,behavior:'smooth'})});
function detail(id){const s=db.series.find(x=>x.id===id);if(!s)return;
$('#modal').innerHTML=`<div class="modal" data-act="close"><div class="box" data-stop><button class="x" data-act="close">×</button><div class="dt"><div class="po" ${bg(s.cover)}>${s.cover?'':esc(s.title[0])}</div><div><h2 style="margin:0 0 8px">${esc(s.title)}</h2>${s.altTitles?`<div class="mut">${esc(s.altTitles)}</div>`:''}<div class="meta" style="margin:8px 0"><span class="tag">${esc(s.type)}</span><span>${esc(s.status)}</span>${s.rating?`<b class="dot">★ ${esc(s.rating)}</b>`:''}${s.year?`<span class="dot">${esc(s.year)}</span>`:''}${s.author?`<span class="dot">${esc(s.author)}</span>`:''}</div><div class="meta">${s.genres.map(g=>`<span class="chip" style="padding:2px 9px;font-size:12px">${esc(g)}</span>`).join('')}</div>${(s.tags||[]).length?`<div class="tagrow" style="margin-top:10px">${s.tags.map(g=>`<button class="tgb" style="padding:3px 10px;font-size:12px" data-act="gtag" data-g="${esc(g)}">#${esc(g)}</button>`).join('')}</div>`:''}<p>${esc(s.description)||'<span class="mut">No description.</span>'}</p></div></div>${s.chaptersOff?'':`<h3>Chapters (${s.chapters.length})</h3>${s.chapters.length?`<div class="chs">${s.chapters.map((c,i)=>`<button data-act="read" data-id="${s.id}" data-c="${i}">Ch. ${esc(c.number)}${c.title?`<br><small class="mut">${esc(c.title)}</small>`:''}</button>`).join('')}</div>`:'<p class="mut">No chapters yet.</p>'}`}</div></div>`}
function reader(id,ci){const s=db.series.find(x=>x.id===id),c=s&&s.chapters[ci];if(!c)return;
const pr=ci>0?`<button class="btn gh sm" data-act="read" data-id="${id}" data-c="${ci-1}">‹ Prev</button>`:'',nx=ci<s.chapters.length-1?`<button class="btn ac sm" data-act="read" data-id="${id}" data-c="${ci+1}">Next ›</button>`:'';
$('#modal').innerHTML=`<div class="reader" id="rd"><div class="bar"><button class="btn gh sm" data-act="open" data-id="${id}">✕</button><span>${esc(s.title)} · Ch. ${esc(c.number)}</span>${pr}${nx}</div>${c.pages.length?c.pages.map(p=>`<img src="${esc(p)}" alt="" loading="lazy">`).join(''):'<p style="text-align:center;padding:60px" class="mut">No pages in this chapter.</p>'}<div style="text-align:center;padding:20px">${nx}</div></div>`;$('#rd').scrollTop=0}
/* ---------- ADMIN ---------- */
const DEFG=["Action", "Adventure", "Comedy", "Cooking", "Crime", "Cultivation", "Drama", "Ecchi", "Fantasy", "Gender Bender", "Harem", "Historical", "Horror", "Isekai", "Josei", "Magic", "Martial Arts", "Mecha", "Medical", "Military", "Music", "Mystery", "Psychological", "Reincarnation", "Romance", "School Life", "Sci-Fi", "Seinen", "Shoujo", "Shounen", "Slice of Life", "Sports", "Supernatural", "Survival", "Thriller", "Tragedy", "Webtoon", "Wuxia", "Xianxia", "Yuri"];db.genres=db.genres||[];db.tags=db.tags||[];db.top=db.top||{};db.settings=db.settings||{};let av='titles',et='title';
const allG=()=>[...new Set([...(db.genres||[]),...db.series.flatMap(s=>s.genres)])].sort((a,b)=>a.localeCompare(b));
const gCount=g=>db.series.filter(s=>s.genres.includes(g)).length;
const imgF=(k,label)=>{const v=cur[k]||'';return `<div class="w"><label>${label}</label><div class="im"><div class="pv" ${bg(v)}></div><div><input type="text" data-k="${k}" placeholder="${v.startsWith('data:')?'Uploaded image — paste a link to replace':'Paste image link (https://…)'}" value="${v.startsWith('data:')?'':esc(v)}"><div class="row2"><label class="btn gh sm" style="margin:0;cursor:pointer">Upload<input type="file" accept="image/*" hidden data-up="${k}"></label>${v?`<button class="btn gh sm" data-act="clr" data-k="${k}">Remove</button>`:''}</div></div></div></div>`};

overning law</h2><p>These terms are governed by the laws of the country in which Kap Manga is operated, without regard to conflict-of-law rules.</p><h2>9. Contact</h2><p>Questions about these terms? Reach us through the <a href="contact.html">Contact</a> page${mail()?' or at '+cm():''}.</p>`},
privacy:{t:'Privacy Policy',u:UPD,b:()=>`<p>Your privacy matters to us. This policy explains what information Kap Manga handles and the choices you have.</p><h2>1. The short version</h2><p>You do not need an account to use Kap Manga. We do not sell your personal information, and we do not use advertising or tracking cookies.</p><h2>2. Information we handle</h2><ul><li><strong>Messages you send us.</strong> If you contact us or report an issue, we receive the details you choose to include, such as your name and email address.</li><li><strong>Data stored on your device.</strong> The site saves its library data and settings in your browser storage on your own device. See our <a href="cookies.html">Cookie Settings</a> page for details.</li><li><strong>Technical data.</strong> Our hosting provider may keep standard server logs, such as IP address, browser type and the pages requested, for security and reliability.</li></ul><h2>3. How we use information</h2><ul><li>To reply to your messages and fix problems you report.</li><li>To keep the site secure and working properly.</li></ul><h2>4. Third-party services</h2><p>The site loads the Inter typeface from Google Fonts. When your browser requests the font files, Google receives technical information such as your IP address. Material linked from the site may also be hosted by third parties with their own privacy practices.</p><h2>5. Retention</h2><p>We keep messages only as long as needed to respond and follow up. Data saved in your browser stays on your device until you clear it.</p><h2>6. Children</h2><p>Kap Manga is not directed at children under 13, and we do not knowingly collect personal information from them.</p><h2>7. Your rights</h2><p>Depending on where you live, you may have the right to ask what information we hold about you, to correct it or to have it deleted. Contact us and we will help.</p><h2>8. Changes to this policy</h2><p>We may update this policy from time to time. The date at the top shows the latest version.</p><h2>9. Contact</h2><p>For privacy questions, use the <a href="contact.html">Contact</a> page${mail()?' or write to '+cm():''}.</p>`},
dmca:{t:'DMCA',u:UPD,b:()=>`<p>Kap Manga respects the intellectual property rights of others and responds to notices of alleged copyright infringement that comply with the Digital Millennium Copyright Act (DMCA) and similar laws.</p><h2>Filing a notice</h2><p>If you are a copyright owner, or authorized to act for one, and believe material on this site infringes your copyright, send us a written notice that includes:</p><ol><li>your physical or electronic signature;</li><li>a description of the copyrighted work you claim has been infringed;</li><li>the exact page or link where the material appears, so we can find it;</li><li>your name, address, telephone number and email address;</li><li>a statement that you have a good-faith belief the use is not authorized by the copyright owner, its agent or the law;</li><li>a statement, made under penalty of perjury, that the information in your notice is accurate and that you are authorized to act for the copyright owner.</li></ol><h2>Where to send it</h2><p>Send your notice to ${cm()}. Incomplete notices may delay our response.</p><h2>What happens next</h2><p>When we receive a valid notice, we will promptly remove or disable access to the material and may tell the person who added it.</p><h2>Counter-notice</h2><p>If you believe material was removed by mistake or misidentification, you may send us a counter-notice with your signature, a description of the removed material and where it appeared, a statement under penalty of perjury that you believe it was removed in error, and your name, address and phone number. We may restore the material if the original complainant does not take legal action within the period the law allows.</p><h2>Repeat infringers</h2><p>In appropriate circumstances, we will end access for people who repeatedly infringe the rights of others.</p><h2>Misrepresentations</h2><p>Knowingly submitting a false notice or counter-notice may have legal consequences, including liability for damages.</p>`},
cookies:{t:'Cookie Settings',u:UPD,b:()=>`<p>Here is exactly what Kap Manga stores on your device, and what it does not.</p><div class="note"><strong>No tracking.</strong> Kap Manga does not set advertising, analytics or tracking cookies, so there is nothing to opt out of.</div><h2>What is stored on your device</h2><ul><li><strong>Browser storage (IndexedDB, with local storage as a fallback).</strong> Essential. It holds the site library and settings so they are still there when you return. It never leaves your device through this site.</li><li><strong>Cookies.</strong> Kap Manga itself does not set any cookies.</li></ul><h2>Third-party requests</h2><ul><li><strong>Google Fonts.</strong> Loads the Inter typeface. Google may receive your IP address when your browser fetches the font files.</li></ul><h2>Your choices</h2><p>You can clear stored data at any time in your browser settings, usually under “Clear browsing data” or “Site settings”. Clearing it removes the saved library from this device. You can also block third-party requests with a browser extension, and the site will use a standard system font instead.</p><p>Read more in our <a href="privacy.html">Privacy Policy</a>.</p>`}};
