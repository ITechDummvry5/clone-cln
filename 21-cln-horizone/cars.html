<body data-page="cars" data-nav="dark">
<div id="site-header"></div>

<main class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> › Cars</div>
  <div class="bar"><div><b>Any location</b><span>Mon, 23 Nov, 10:00 AM → Sat, 28 Nov, 10:00 AM · 5 days · Self-drive</span></div><a class="btn ghost" href="index.html">Modify search</a></div>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <header><b>Filters</b><button id="reset">Reset all</button></header>
      <div class="fg"><h4>Vehicle type</h4><div class="chips" data-f="type"></div></div>
      <div class="fg"><h4>Transmission</h4><div class="chips seg" data-f="trans"></div></div>
      <div class="fg"><h4>Fuel</h4><div class="chips" data-f="fuel"></div></div>
      <div class="fg"><h4>Seats</h4><div class="chips" data-f="seats"></div></div>
      <div class="fg"><h4>Guest rating</h4><div class="chips" data-f="rating"></div></div>
    </aside>

    <section class="res">
      <div class="top">
        <div><h1 id="count"></h1><p class="sub" id="fromPrice"></p></div>
        <div><select id="sort" data-pick aria-label="Sort"><option value="rec">Recommended</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select>
          <span class="views"><button class="on" data-v="grid" aria-label="Grid view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button><button data-v="list" aria-label="List view"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></button></span></div>
      </div>
      <p class="note"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>Showing every car in the fleet. <b>Choose a pick-up location</b> to see what’s available there and the exact total.</span></p>
      <div class="grid3" id="fleet"></div>
    </section>
  </div>
</main>
