<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOKOHAMA - MINERVA</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="forsedan.css">
</head>
<body>
  <header>
    <div class="logo">YOKOHAMA - MINERVA</div>
    <a href="../carbodytype.html" class="return-button">Return</a>

  <div class="container">
    <h1>Choose the manufacturer</h1>
    
    <div class="logo-grid">
      <a href="../carselector/Sedantoy.html" class="logo-item toyota">
        <div class="logo-image">
          <img src="../img/Toyota logo.png" alt="Toyota Logo">

      <a href="../carselector/sedanmitsu.html" class="logo-item mitsubishi">

      <a href="../carselector/sedanford.html" class="logo-item ford">

      <a href="../carselector/sedannissan.html" class="logo-item nissan">

      <a href="../carselector/sedansuzu.html" class="logo-item suzuki">

          <img src="../img/Suzuki_logo_2.svg.png" alt="Suzuki Logo">
